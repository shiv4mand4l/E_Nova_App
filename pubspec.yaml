name: e_nova
description: "A new Flutter project."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.12.0

# ------------------[Packages]-------------------
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # --------------------[Smooth Page Indicator]------------------------------
  smooth_page_indicator: ^2.0.1

  # ---------------------------[Icon and Animations]-------------------------------
  lottie: ^3.5.1
  iconsax: ^0.0.8

  # -------------------[Go Router]-------------------
  go_router: ^17.3.0

  # -------------------[State Management]-------------------
  flutter_bloc: ^9.1.1
  bloc: ^9.2.1

  # --------------[Utilities]---------------------
  equatable: ^2.0.8
  fpdart: ^1.2.0

  # -------------[Firebase]----------------------------
  firebase_core: ^4.12.1
  cloud_firestore: ^6.7.1
  firebase_auth: ^6.5.6

  # -------------[Local Database]----------------------------
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # ------------------[Assets]-------------------
  assets:
    - assets/fonts/
    - assets/animations/
    - assets/images/
  # ------------------[Fonts]-------------------
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Light.ttf
          weight: 300

        - asset: assets/fonts/Nunito-Regular.ttf
          weight: 400

        - asset: assets/fonts/Nunito-Italic.ttf
          style: italic

        - asset: assets/fonts/Nunito-Medium.ttf
          weight: 500

        - asset: assets/fonts/Nunito-MediumItalic.ttf
          weight: 500
          style: italic

        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600

        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
