name: e_nova
description: "A new Flutter project."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.12.0

# ------------------[Packages]-------------------
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  smooth_page_indicator: ^2.0.1
  flutter_bloc: ^9.1.1
  go_router: ^17.3.0
  bloc: ^9.2.1
  equatable: ^2.0.8

  # --------------[Utilities]---------------------

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # ------------------[Assets]-------------------
  assets:
    - assets/fonts/
    - assets/images/
  # ------------------[Fonts]-------------------
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Light.ttf
          weight: 300

        - asset: assets/fonts/Nunito-Regular.ttf
          weight: 400

        - asset: assets/fonts/Nunito-Italic.ttf
          style: italic

        - asset: assets/fonts/Nunito-Medium.ttf
          weight: 500

        - asset: assets/fonts/Nunito-MediumItalic.ttf
          weight: 500
          style: italic

        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600

        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
